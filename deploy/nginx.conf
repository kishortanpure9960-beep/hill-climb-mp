# Nginx reverse proxy in front of the game server.
# The Vercel client is served over HTTPS, so the browser refuses plain ws:// —
# this terminates TLS and forwards the WebSocket upgrade to Node on :3000.
#
#   /etc/nginx/sites-available/hill-climb-mp  (then symlink into sites-enabled)
# Replace game.example.com with your domain, then:
#   sudo certbot --nginx -d game.example.com

server {
  listen 80;
  listen [::]:80;
  server_name game.example.com;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    # required for WebSockets
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # the server ticks at 60 Hz and holds socket connections open
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }
}
