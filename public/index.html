<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10131c" />
    <title>Hill Climb MP</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="menu" class="screen">
      <div class="panel">
        <h1>HILL CLIMB <span>MP</span></h1>
        <p class="tag">2&ndash;4 players &middot; one track &middot; any device</p>

        <label>
          <span>Your name</span>
          <input id="nameInput" maxlength="14" placeholder="Racer" autocomplete="off" spellcheck="false" />
        </label>

        <label>
          <span>Room code <em>(leave empty to create)</em></span>
          <input id="roomInput" maxlength="4" placeholder="AUTO" autocomplete="off" spellcheck="false" />
        </label>

        <button id="playBtn" class="primary">Play</button>
        <p id="menuError" class="error"></p>

        <div class="help">
          <b>Controls</b>
          <span><kbd>&rarr;</kbd> / <kbd>D</kbd> gas</span>
          <span><kbd>&larr;</kbd> / <kbd>A</kbd> brake &amp; reverse</span>
          <span><kbd>R</kbd> reset to checkpoint</span>
          <span>On phones: use the two buttons</span>
        </div>
      </div>
    </div>

    <div id="lobby" class="screen hidden">
      <div class="panel">
        <p class="eyebrow">Room</p>
        <h2 id="roomCode">----</h2>
        <p class="tag">Friends open this same address and enter the code.</p>

        <ul id="playerList" class="players"></ul>

        <button id="startBtn" class="primary">Start race</button>
        <p id="waitMsg" class="hint">Waiting for the host&hellip;</p>
        <button id="leaveBtn" class="ghost">Leave room</button>
      </div>
    </div>

    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-left">
          <div id="timer">0.0s</div>
          <div id="dist">0 m</div>
        </div>
        <div id="rank" class="rank"></div>
      </div>
      <div id="countdown" class="countdown hidden"></div>
      <div id="finishBanner" class="finish-banner hidden"></div>
      <div class="speedo"><span id="speed">0</span><small>km/h</small></div>
      <div id="touchControls" class="touch hidden">
        <button id="btnBrake" class="tbtn" aria-label="Brake">&#9664;</button>
        <button id="btnGas" class="tbtn" aria-label="Gas">&#9654;</button>
      </div>
    </div>

    <div id="results" class="screen hidden">
      <div class="panel">
        <h2>Results</h2>
        <ol id="resultList" class="results"></ol>
        <button id="rematchBtn" class="primary">Rematch</button>
        <p id="rematchHint" class="hint"></p>
        <button id="leaveResultsBtn" class="ghost">Leave</button>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="/config.js"></script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
